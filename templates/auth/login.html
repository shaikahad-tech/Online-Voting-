{% extends 'base.html' %}
{% block title %}NovaVote · Login{% endblock %}
{% block content %}
<section class="auth-shell">
    <form method="post" class="card auth-card glass">
        <h1>Welcome Back</h1>
        <p>Sign in to cast votes and manage elections.</p>
        <label>Email<input required type="email" name="email" /></label>
        <label>Password<input required type="password" name="password" /></label>
        <button class="btn btn-lg" type="submit">Login</button>
        <p class="muted">No account? <a href="{{ url_for('register') }}">Register</a></p>
    </form>
</section>
{% endblock %}
